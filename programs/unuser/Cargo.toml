[package]
name = "unuser"
version = "0.1.0"
description = "SOL perpetuals with no user accounts: zero-knowledge notes for the money, Arcium MPC for the positions"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "unuser"

[features]
default = ["test-oracle", "onchain-circuits"]
# Local builds: an oracle the market authority sets, and circuits uploaded on chain. Devnet and mainnet build with
# --no-default-features: Pyth's SOL/USD account, and circuits fetched from CIRCUIT_URL and checked by hash.
test-oracle = []
onchain-circuits = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.15.0" }
arcium-macros = "=0.15.0"
arcium-anchor = "=0.15.0"
anchor-spl = "1.0.2"
groth16-solana = "0.2.0"
solana-poseidon = "=3.1.14"
solana-sha256-hasher = "3"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
