[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
unuser = "Hk5iuiYjqSeH2bXcENqxHPGamKJbferFPSsCuPPsnKMy"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 --exit tests/engine.ts"

[test.validator]
startup_wait = 60000
# Other sessions run validators on this machine; keep gossip and the dynamic ports out of their way.
gossip_port = 28001
dynamic_port_range = "28010-28080"

# A snapshot of Pyth's mainnet SOL/USD account, so a network build (Pyth reader) can rehearse on the local stack.
# Refresh it right before a rehearsal: solana account 7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE --output json
#   -u mainnet-beta > tests/fixtures/pyth_sol_usd.json   (ENGINE.md, "Rehearsal")
[[test.validator.account]]
address = "7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE"
filename = "tests/fixtures/pyth_sol_usd.json"
